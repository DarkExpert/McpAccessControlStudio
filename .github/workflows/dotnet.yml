name: .NET
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Full Release suite including audit security regressions
        run: dotnet test -c Release --no-build
      - name: Real MCP and SQLite restart demonstration
        run: pwsh -File ./scripts/run-demo.ps1
